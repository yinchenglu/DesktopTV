name: APK release

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read version
        run: |
          python3 - <<'PY'
          import os, re
          source = open('launcher/build.gradle').read()
          version = re.search(r'versionName "([^"]+)"', source).group(1)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('VERSION=' + version + '\n')
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Sign APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/release.jks"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key"
            pass="$ANDROID_KEYSTORE_PASSWORD"
            alias="$ANDROID_KEY_ALIAS"
            echo "SIGN_NOTE=✅ 已用固定密钥签名，可直接覆盖安装" >> "$GITHUB_ENV"
          else
            pass=launchertv
            alias=launchertv
            keytool -genkeypair -keystore "$key" -storepass "$pass" -keypass "$pass" \
              -alias "$alias" -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=LauncherTV, OU=LauncherTV, O=LauncherTV, L=Beijing, ST=Beijing, C=CN"
            echo "SIGN_NOTE=⚠️ 本次 APK 用 CI 临时密钥签名，升级安装需先卸载旧版" >> "$GITHUB_ENV"
          fi
          tools="$ANDROID_HOME/build-tools/37.0.0"
          dist=launcher/build/distribution
          mkdir -p "$dist"
          apk="$dist/LauncherTV-$VERSION.apk"
          "$tools/apksigner" sign --ks "$key" --ks-key-alias "$alias" \
            --ks-pass pass:"$pass" --key-pass pass:"$pass" \
            --out "$apk" launcher/build/outputs/apk/release/launcher-release-unsigned.apk
          "$tools/apksigner" verify "$apk"
          rm -f "$key"
          cd "$dist"
          sha256sum "LauncherTV-$VERSION.apk" > "LauncherTV-$VERSION.apk.sha256"
          ls -la

      - name: Save build log on failure
        if: failure()
        run: |
          set -e
          git config user.name "launchertv-ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -B ci-log
          ./gradlew --no-daemon assembleRelease > ci-build.log 2>&1 || true
          git add -f ci-build.log
          git commit -m "ci: build log" || exit 0
          git push -f origin ci-log

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LauncherTV-${{ env.VERSION }}
          path: |
            launcher/build/distribution/LauncherTV-${{ env.VERSION }}.apk
            launcher/build/distribution/LauncherTV-${{ env.VERSION }}.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "launcher/build/distribution/LauncherTV-$VERSION.apk" \
            "launcher/build/distribution/LauncherTV-$VERSION.apk.sha256" \
            --verify-tag --title "LauncherTV $VERSION" --notes "${SIGN_NOTE:-}"
